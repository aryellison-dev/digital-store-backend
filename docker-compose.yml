services:
  db:
    image: mysql:8.0
    container_name: digital-store-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: digital_store
      MYSQL_USER: digital_store
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -plocal_root_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
